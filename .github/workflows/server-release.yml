name: Server release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODRAIL_REGISTRY: ghcr.io/nodrail
  NODRAIL_VERSION: ${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  candidates:
    name: Build release candidates
    if: github.repository == 'Nodrail/nodrail-server'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      server: ${{ steps.server.outputs.digest }}
      migrate: ${{ steps.migrate.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        run: |
          [[ "$NODRAIL_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server and push by digest
        id: server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: server
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/nodrail/server,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Build server-migrate and push by digest
        id: migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: server-migrate
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/nodrail/server-migrate,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true

  self-hosted:
    name: Compose smoke (${{ matrix.platform }})
    needs: candidates
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            node-arch: x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            node-arch: arm64
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      NODRAIL_SERVER_DIGEST: ${{ needs.candidates.outputs.server }}
      NODRAIL_MIGRATE_DIGEST: ${{ needs.candidates.outputs.migrate }}
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      EXPECTED_NODE_ARCH: ${{ matrix.node-arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check immutable Compose inputs
        working-directory: apps/web/deploy
        run: |
          [[ "$NODRAIL_SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$NODRAIL_MIGRATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
      - name: Check migration, app readiness, product-only routing and scheduled work
        working-directory: apps/web/deploy
        run: |
          for key in POSTGRES_PASSWORD OWNER_PASSWORD APP_DATABASE_PASSWORD AUTH_DATABASE_PASSWORD NOTIFICATIONS_SECRET; do
            export "$key=$(openssl rand -hex 24)"
          done
          trap 'docker compose logs --no-color; docker compose down --volumes' EXIT
          server="$NODRAIL_REGISTRY/server:$NODRAIL_VERSION@$NODRAIL_SERVER_DIGEST"
          migrate="$NODRAIL_REGISTRY/server-migrate:$NODRAIL_VERSION@$NODRAIL_MIGRATE_DIGEST"
          docker compose config --format json | jq -e --arg server "$server" --arg migrate "$migrate" '
            .services.app.image == $server and .services.scheduler.image == $server and .services.migrate.image == $migrate'
          docker compose up -d --wait --wait-timeout 180 app
          test "$(docker compose exec -T app node -p process.arch)" = "$EXPECTED_NODE_ARCH"
          test "$(docker compose run --rm --no-deps --entrypoint node migrate -p process.arch)" = "$EXPECTED_NODE_ARCH"
          curl --fail --silent --show-error "$APP_ORIGIN/api/health"
          for path in /docs /pricing /api/waitlist; do
            test "$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$APP_ORIGIN$path")" = 404
          done
          docker compose run --rm --no-deps --entrypoint pnpm migrate \
            admin:create --email smoke@example.test --generate >/dev/null
          docker compose run --rm --no-deps -e SCHEDULER_EVERY_SECONDS=0 scheduler
          curl --fail --silent --show-error -H "Authorization: Bearer $NOTIFICATIONS_SECRET" \
            "$APP_ORIGIN/api/health/ready" | jq -e '.ready and .checks.auth == "configured"'

  publish:
    name: Sign and tag the smoke-tested indexes
    needs: [candidates, self-hosted]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign and promote without rebuilding
        env:
          SERVER_DIGEST: ${{ needs.candidates.outputs.server }}
          MIGRATE_DIGEST: ${{ needs.candidates.outputs.migrate }}
        run: |
          server="$NODRAIL_REGISTRY/server"
          migrate="$NODRAIL_REGISTRY/server-migrate"
          cosign sign --yes "$server@$SERVER_DIGEST"
          cosign sign --yes "$migrate@$MIGRATE_DIGEST"

          promote() {
            local image="$1" digest="$2"
            local tag="$image:$NODRAIL_VERSION"
            docker buildx imagetools create --tag "$tag" "$image@$digest"
            test "$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag")" = "$digest"
          }
          promote "$server" "$SERVER_DIGEST"
          promote "$migrate" "$MIGRATE_DIGEST"
