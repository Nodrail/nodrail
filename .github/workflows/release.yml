name: Release

# Changesets opens the version PR. The release actor tags the merged commit,
# then a maintainer dispatches staging for one exact tag from protected main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable npm tag (for example @nodrail/client@0.8.1)
        type: string
        required: true
      operation:
        description: Stage on npm or record an approved version on GitHub
        type: choice
        options: [stage, record]
        required: true
      expected_sha256:
        description: Original tarball SHA-256, required when retrying a rejected stage
        type: string

permissions:
  contents: read

concurrency:
  group: release

jobs:
  version:
    name: Version packages
    if: github.repository == 'Nodrail/nodrail' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push the version branch
      pull-requests: write  # open the version PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false

  verify:
    name: Verify release tag
    if: github.repository == 'Nodrail/nodrail' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.mjs npm "$RELEASE_TAG"

  stage:
    name: Stage on npm
    if: inputs.operation == 'stage'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm trusted publishing (OIDC) and provenance
    steps:
      # Build the dispatched main commit; the release script checks that its
      # packages match the tag's (provenance must name what was built).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          RELEASE_OPERATION: stage

  record:
    name: Record GitHub release
    if: inputs.operation == 'record'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the GitHub release for a published tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/stage-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_OPERATION: record
          GH_TOKEN: ${{ github.token }}
