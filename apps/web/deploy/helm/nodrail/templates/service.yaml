apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodrail.name" . }}
  labels:
    {{- include "nodrail.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nodrail.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
